# Labels for pull requests, applied by the "Detect changes" job in ci.yml (actions/labeler).
# CI reads three of them to skip work a PR cannot affect: docs-only, area:docker, release-scripts.
# The rest only tell reviewers what a PR touches. sync-labels is on, so a label whose files are no
# longer changed (or that was added by hand without matching files) is removed on the next push.

# Gate: when every changed file is documentation or agent config, Build and Coverage are skipped.
docs-only:
  - changed-files:
      - any-glob-to-all-files:
          - "**/*.md"
          - "openspec/**"
          - ".claude/**"
          - ".agents/**"
          - "LICENSE"

# Gate: the container image is built on a PR only when something that feeds it changed.
# Only files the API image is built from. Directory.Packages.props is left out on purpose: restore runs
# in locked mode, so a version bump that reaches the image always changes a src/ lock file too, while a
# test-only bump (xunit, Verify, Testcontainers) touches just tests/ lock files and needs no image build.
area:docker:
  - changed-files:
      - any-glob-to-any-file:
          - "**/Dockerfile"
          - ".dockerignore"
          - "global.json"
          - "Directory.Build.props"
          - "src/**/*.csproj"
          - "src/**/packages.lock.json"
          - "orchestration/TacticusPlanner.ServiceDefaults/*.csproj"
          - "orchestration/TacticusPlanner.ServiceDefaults/packages.lock.json"

# Gate: the release script tests (Ubuntu and Windows) run only when the scripts changed.
release-scripts:
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/release/**"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

# The same label Dependabot adds. Its branches match too, so sync-labels never strips it from a
# Dependabot PR that changes no package file (a GitHub Actions or Docker base image bump).
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "Directory.Packages.props"
          - "**/packages.lock.json"
          - "global.json"
  - head-branch:
      - "^dependabot/"

api-contract:
  - changed-files:
      - any-glob-to-any-file:
          - "artifacts/openapi/**"

db-migration:
  - changed-files:
      - any-glob-to-any-file:
          - "src/TacticusPlanner.Persistence/Migrations/**"

area:api:
  - changed-files:
      - any-glob-to-any-file:
          - "src/TacticusPlanner.Api/**"

area:domain:
  - changed-files:
      - any-glob-to-any-file:
          - "src/TacticusPlanner.Domain/**"
          - "src/TacticusPlanner.GameDomain/**"

area:game-catalog:
  - changed-files:
      - any-glob-to-any-file:
          - "src/TacticusPlanner.GameCatalog/**"
          - "src/TacticusPlanner.GameCatalog.Compiler/**"
          - "src/TacticusPlanner.GameCatalog.Models/**"

area:persistence:
  - changed-files:
      - any-glob-to-any-file:
          - "src/TacticusPlanner.Persistence/**"

area:tacticus-api:
  - changed-files:
      - any-glob-to-any-file:
          - "src/TacticusPlanner.TacticusApi/**"

area:orchestration:
  - changed-files:
      - any-glob-to-any-file:
          - "orchestration/**"

tests-only:
  - changed-files:
      - any-glob-to-all-files:
          - "tests/**"
