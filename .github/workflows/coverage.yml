name: Coverage

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'openspec/**'
      - '.claude/**'
      - '.agents/**'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read
  code-quality: write
  pull-requests: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required checks must always report, so PRs are not filtered with paths-ignore;
  # instead the work is skipped (a skipped job satisfies a required check).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename') || { echo code=true >> "$GITHUB_OUTPUT"; exit 0; }
          if grep -qvE '\.md$|^(openspec|\.claude|\.agents)/|^LICENSE$' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ConnectionStrings__planner-db: Host=localhost;Port=5432;Database=tacticus_planner;Username=postgres;Password=postgres
      Authentication__Authority: https://example.ciamlogin.com/example.onmicrosoft.com/v2.0
      Authentication__Audience: api://tacticus-planner-api-ci

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked solution dependencies
        run: dotnet restore TacticusPlanner.slnx --locked-mode

      - name: Restore platform-specific AppHost dependencies
        run: dotnet restore orchestration/TacticusPlanner.AppHost/TacticusPlanner.AppHost.csproj

      - name: Build
        run: dotnet build TacticusPlanner.slnx --configuration Release --no-restore

      - name: Test API with coverage
        run: >
          dotnet test tests/TacticusPlanner.Api.Tests/TacticusPlanner.Api.Tests.csproj
          --configuration Release --no-build --collect:"XPlat Code Coverage"
          --logger trx --results-directory ./coverage/api

      - name: Test API integration with coverage
        run: >
          dotnet test tests/TacticusPlanner.Api.IntegrationTests/TacticusPlanner.Api.IntegrationTests.csproj
          --configuration Release --no-build --collect:"XPlat Code Coverage"
          --logger trx --results-directory ./coverage/api-integration

      - name: Test persistence integration with coverage
        run: >
          dotnet test tests/TacticusPlanner.Persistence.IntegrationTests/TacticusPlanner.Persistence.IntegrationTests.csproj
          --configuration Release --no-build --collect:"XPlat Code Coverage"
          --logger trx --results-directory ./coverage/persistence

      - name: Test GameCatalog with coverage
        run: >
          dotnet test tests/TacticusPlanner.GameCatalog.Tests/TacticusPlanner.GameCatalog.Tests.csproj
          --configuration Release --no-build --collect:"XPlat Code Coverage"
          --logger trx --results-directory ./coverage/game-catalog

      - name: Resolve coverage file paths
        id: coverage-files
        shell: bash
        run: |
          for label in api api-integration persistence game-catalog; do
            file=$(find "./coverage/$label" -name coverage.cobertura.xml -print -quit)
            if [ -z "$file" ]; then
              echo "Missing coverage report for $label" >&2
              exit 1
            fi
            echo "$label=$file" >> "$GITHUB_OUTPUT"
          done

      - name: Upload API coverage
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: ${{ steps.coverage-files.outputs.api }}
          language: C#
          label: coverage/api

      - name: Upload API integration coverage
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: ${{ steps.coverage-files.outputs.api-integration }}
          language: C#
          label: coverage/api-integration

      - name: Upload persistence integration coverage
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: ${{ steps.coverage-files.outputs.persistence }}
          language: C#
          label: coverage/persistence

      - name: Upload GameCatalog coverage
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: ${{ steps.coverage-files.outputs.game-catalog }}
          language: C#
          label: coverage/game-catalog

      - name: Retain coverage test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-test-results
          path: coverage/
          if-no-files-found: ignore
