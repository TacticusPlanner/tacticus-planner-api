name: Deploy API

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment holding the Azure deployment variables (stage or production).
        required: true
        type: string
      image:
        description: Immutable image reference (<acr>.azurecr.io/tacticus-planner-api@sha256:...).
        required: true
        type: string
      jobs-image:
        description: Immutable jobs image reference (<acr>.azurecr.io/tacticus-planner-jobs@sha256:...), set on the Container Apps Job once the API is healthy. Empty skips it.
        required: false
        type: string
        default: ""
      allow-missing-app:
        description: Report success without deploying when the Container App does not exist yet (first staging bootstrap).
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}

    steps:
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check image reference
        id: image
        shell: bash
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          REFERENCE: ${{ inputs.image }}
        run: |
          if [[ ! "$REFERENCE" =~ ^$ACR_NAME\.azurecr\.io/tacticus-planner-api@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::$REFERENCE is not an immutable $ACR_NAME image reference."
            exit 1
          fi
          echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"

      - name: Check jobs image reference
        id: jobs-image
        if: inputs.jobs-image != ''
        shell: bash
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          REFERENCE: ${{ inputs.jobs-image }}
        run: |
          if [[ ! "$REFERENCE" =~ ^$ACR_NAME\.azurecr\.io/tacticus-planner-jobs@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::$REFERENCE is not an immutable $ACR_NAME jobs image reference."
            exit 1
          fi
          echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --version 1.3.0b5

      - name: Check Container App exists
        id: check
        shell: bash
        env:
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
          ALLOW_MISSING_APP: ${{ inputs.allow-missing-app }}
        run: |
          if output="$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --output none 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif ! grep -q 'ResourceNotFound' <<< "$output"; then
            # Permission or transient failures must not look like a missing app.
            echo "$output"
            echo "::error::Could not read Container App $CONTAINER_APP_NAME."
            exit 1
          elif [[ "$ALLOW_MISSING_APP" == "true" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Container App $CONTAINER_APP_NAME does not exist in $RESOURCE_GROUP_NAME."
            exit 1
          fi

      - name: Update Container App image
        if: steps.check.outputs.exists == 'true'
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --image "$IMAGE_REFERENCE" \
            --no-wait \
            --output none

      - name: Wait for revision to become healthy
        if: steps.check.outputs.exists == 'true'
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
        run: |
          for attempt in {1..30}; do
            revision=""
            if app_status="$(az containerapp show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP_NAME" \
              --query '[properties.latestRevisionName, properties.provisioningState]' \
              --output tsv)"; then
              mapfile -t app_fields <<< "$app_status"
              revision="${app_fields[0]:-}"
              provisioning_state="${app_fields[1]:-}"

              if [[ "$provisioning_state" == "Failed" ]]; then
                echo "::error::Container App deployment failed."
                exit 1
              fi
            else
              echo "::warning::Failed to query Container App deployment status; retrying."
            fi

            if [[ -n "$revision" ]]; then
              if revision_status="$(az containerapp revision show \
                --name "$CONTAINER_APP_NAME" \
                --resource-group "$RESOURCE_GROUP_NAME" \
                --revision "$revision" \
                --query '[properties.healthState, properties.runningState, properties.template.containers[0].image]' \
                --output tsv)"; then
                mapfile -t revision_fields <<< "$revision_status"
                health="${revision_fields[0]:-}"
                running="${revision_fields[1]:-}"
                revision_image="${revision_fields[2]:-}"

                if [[ "$revision_image" == "$IMAGE_REFERENCE" && "$health" == "Healthy" && "$running" == Running* ]]; then # Running or RunningAtMaxScale
                  break
                fi

                if [[ "$revision_image" == "$IMAGE_REFERENCE" && "$running" == "ActivationFailed" ]]; then
                  echo "::error::Revision $revision failed to activate."
                  exit 1
                fi
              else
                echo "::warning::Failed to query revision $revision; retrying."
              fi
            fi

            echo "Attempt $attempt: revision=$revision health=${health:-} running=${running:-}"
            if [[ "$attempt" == "30" ]]; then
              echo "::error::Revision $revision did not become healthy within five minutes."
              exit 1
            fi

            sleep 10
          done

      - name: Record deployment summary
        if: steps.check.outputs.exists == 'true'
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: echo "Deployed $IMAGE_REFERENCE" >> "$GITHUB_STEP_SUMMARY"

      # The job exists only after a workload deploy with --jobs-image, and the deployment identity can
      # read it only after `access post` (tacticus-planner-infra). Until both, the update is skipped
      # with a warning; ARM answers a missing resource outside the identity's scope with
      # AuthorizationFailed, not ResourceNotFound, so both mean "not set up yet".
      - name: Update jobs image
        if: steps.check.outputs.exists == 'true' && steps.jobs-image.outputs.reference != ''
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ steps.jobs-image.outputs.reference }}
          CONTAINER_APP_JOB_NAME: ${{ vars.CONTAINER_APP_JOB_NAME }}
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
        run: |
          if [[ -z "$CONTAINER_APP_JOB_NAME" ]]; then
            echo "::warning::CONTAINER_APP_JOB_NAME is not set; run access pre in tacticus-planner-infra."
            echo "Jobs image not deployed: CONTAINER_APP_JOB_NAME is not set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! output="$(az containerapp job show \
            --name "$CONTAINER_APP_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --output none 2>&1)"; then
            if grep -qE 'ResourceNotFound|AuthorizationFailed' <<< "$output"; then
              echo "::warning::Container Apps Job $CONTAINER_APP_JOB_NAME is missing or not readable yet; deploy the workload with --jobs-image, then run access post."
              echo "Jobs image not deployed: $CONTAINER_APP_JOB_NAME is missing or not readable yet." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "$output"
            echo "::error::Could not read Container Apps Job $CONTAINER_APP_JOB_NAME."
            exit 1
          fi

          # Only the image changes; the next execution (az containerapp job start) runs it.
          az containerapp job update \
            --name "$CONTAINER_APP_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --container-name jobs \
            --image "$IMAGE_REFERENCE" \
            --output none

          job_image="$(az containerapp job show \
            --name "$CONTAINER_APP_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --query 'properties.template.containers[0].image' \
            --output tsv)"
          if [[ "$job_image" != "$IMAGE_REFERENCE" ]]; then
            echo "::error::Container Apps Job $CONTAINER_APP_JOB_NAME runs $job_image, not $IMAGE_REFERENCE."
            exit 1
          fi
          echo "Deployed jobs image $IMAGE_REFERENCE" >> "$GITHUB_STEP_SUMMARY"

      - name: Record skipped deployment
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: echo "Container App does not exist; image publication completed without deployment." >> "$GITHUB_STEP_SUMMARY"
