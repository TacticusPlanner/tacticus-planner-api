name: PR Approval Recheck

# Re-runs the PR Approval Gatekeeper after the maintainer submits or dismisses
# a review, so the PR keeps one `check-approval` check that reflects it.
# workflow_run always runs this file from main with the base repository's
# token, also for fork PRs. It never checks out PR code.
on:
  workflow_run:
    workflows:
      - PR Approval Review Relay
    types:
      - completed

permissions:
  actions: write

concurrency:
  group: pr-approval-recheck-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  rerun-gatekeeper:
    # The relay is skipped for reviews by anyone but the maintainer.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run the approval check for the PR head
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo
            const headSha = context.payload.workflow_run.head_sha

            const {
              data: { workflow_runs: runs },
            } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "pr-approval-gatekeeper.yml",
              event: "pull_request_target",
              head_sha: headSha,
              per_page: 1,
            })
            let run = runs[0]
            if (!run) {
              core.notice(`No approval check has run on ${headSha} yet.`)
              return
            }

            // A run still in progress may have read the reviews before this
            // one, so wait for it and re-run it afterwards.
            for (let i = 0; i < 18 && run.status !== "completed"; i++) {
              await new Promise((resolve) => setTimeout(resolve, 10_000))
              ;({ data: run } = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: run.id,
              }))
            }
            if (run.status !== "completed") {
              core.setFailed(`${run.html_url} is still running.`)
              return
            }

            await github.rest.actions.reRunWorkflow({
              owner,
              repo,
              run_id: run.id,
            })
            core.info(`Re-ran ${run.html_url}`)
