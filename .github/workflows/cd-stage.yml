name: CD Stage

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'openspec/**'
      - '.claude/**'
      - '.agents/**'
      - LICENSE
  # Manual re-deploys build the dispatching commit; only main may be dispatched (see the job guard below).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-stage
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    # Only main reaches stage, whether pushed or dispatched; any other dispatched branch is skipped.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_publish-api.yml
    with:
      ref: ${{ github.sha }}

  deploy:
    name: Deploy Stage
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-api.yml
    with:
      environment: stage
      image: ${{ needs.publish.outputs.image }}
      allow-missing-app: true
