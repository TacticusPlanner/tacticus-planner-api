name: CD Stage

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy.
        required: false
        type: string
        default: main

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-stage
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: stage
    outputs:
      image: ${{ steps.image.outputs.reference }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TacticusPlanner.Api/Dockerfile
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/tacticus-planner-api:${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set immutable image reference
        id: image
        shell: bash
        run: |
          reference="${{ vars.ACR_NAME }}.azurecr.io/tacticus-planner-api@${{ steps.build.outputs.digest }}"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$reference\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Stage
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: stage

    steps:
      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Deploy image when the Container App exists
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ needs.publish.outputs.image }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
        run: |
          if az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --output none 2>/dev/null; then
            az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP_NAME" \
              --image "$IMAGE_REFERENCE" \
              --no-wait \
              --output none

            for attempt in {1..30}; do
              revision=""
              if app_status="$(az containerapp show \
                --name "$CONTAINER_APP_NAME" \
                --resource-group "$RESOURCE_GROUP_NAME" \
                --query '[properties.latestRevisionName, properties.provisioningState]' \
                --output tsv)"; then
                mapfile -t app_fields <<< "$app_status"
                revision="${app_fields[0]:-}"
                provisioning_state="${app_fields[1]:-}"

                if [[ "$provisioning_state" == "Failed" ]]; then
                  echo "::error::Container App deployment failed."
                  exit 1
                fi
              else
                echo "::warning::Failed to query Container App deployment status; retrying."
              fi

              if [[ -n "$revision" ]]; then
                if revision_status="$(az containerapp revision show \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP_NAME" \
                  --revision "$revision" \
                  --query '[properties.healthState, properties.runningState, properties.replicas, properties.template.containers[0].image]' \
                  --output tsv)"; then
                  mapfile -t revision_fields <<< "$revision_status"
                  health="${revision_fields[0]:-}"
                  running="${revision_fields[1]:-}"
                  replicas="${revision_fields[2]:-0}"
                  revision_image="${revision_fields[3]:-}"

                  if [[ "$revision_image" == "$IMAGE_REFERENCE" && "$health" == "Healthy" && "$running" == "Running" && "$replicas" -gt 0 ]]; then
                    break
                  fi

                  if [[ "$revision_image" == "$IMAGE_REFERENCE" && "$running" == "ActivationFailed" ]]; then
                    echo "::error::Revision $revision failed to activate."
                    exit 1
                  fi
                else
                  echo "::warning::Failed to query revision $revision; retrying."
                fi
              fi

              if [[ "$attempt" == "30" ]]; then
                echo "::error::Revision $revision did not become healthy within five minutes."
                exit 1
              fi

              sleep 10
            done

            echo "Deployed $IMAGE_REFERENCE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Container App does not exist; image publication completed without deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
