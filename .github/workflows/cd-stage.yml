name: CD Stage

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'openspec/**'
      - '.claude/**'
      - '.agents/**'
      - LICENSE
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy.
        required: false
        type: string
        default: main

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-stage
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    uses: ./.github/workflows/_publish-api.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  deploy:
    name: Deploy Stage
    needs: publish
    uses: ./.github/workflows/_deploy-api.yml
    with:
      environment: stage
      image: ${{ needs.publish.outputs.image }}
      allow-missing-app: true
