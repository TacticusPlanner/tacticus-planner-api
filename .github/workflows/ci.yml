name: CI

on:
  pull_request:
    branches:
      - main
      - "release/**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required checks must always report, so PRs are not filtered with paths-ignore;
  # instead the work is skipped (a skipped job or step satisfies a required check).
  # actions/labeler labels the PR from .github/labeler.yml, and the labels decide what runs.
  # Without a PR (manual runs, merge queue) or when labeling fails (a fork PR has a read-only
  # token), everything runs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      code: ${{ steps.flags.outputs.code }}
      docker: ${{ steps.flags.outputs.docker }}
      release-scripts: ${{ steps.flags.outputs.release-scripts }}
    steps:
      - name: Check out labeler config
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/labeler.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Label pull request
        id: label
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/labeler@v7
        with:
          sync-labels: true

      - name: Decide what runs
        id: flags
        shell: bash
        env:
          LABELED: ${{ steps.label.outcome == 'success' }}
          LABELS: ${{ steps.label.outputs.all-labels }}
        run: |
          if [ "$LABELED" != "true" ]; then
            echo "No labels (no PR, or labeling failed): running everything."
            { echo code=true; echo docker=true; echo release-scripts=true; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Labels: $LABELS"
          has() { tr ',' '\n' <<< "$LABELS" | grep -qxF "$1"; }
          if has docs-only; then echo code=false; else echo code=true; fi >> "$GITHUB_OUTPUT"
          if has area:docker; then echo docker=true; else echo docker=false; fi >> "$GITHUB_OUTPUT"
          if has release-scripts; then echo release-scripts=true; else echo release-scripts=false; fi >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: changes
    uses: ./.github/workflows/_build-api.yml
    with:
      skip: ${{ needs.changes.outputs.code != 'true' }}
      build-image: ${{ needs.changes.outputs.docker == 'true' }}

  # Publishes the coverage that Build already collected, so PR tests run once. Publishing needs a
  # write token, so it runs apart from the job that executes the PR's code. Named "Coverage" to
  # satisfy the required check of that name. Build tests the PR's merge commit, so the report can
  # drift slightly from the head commit it is attached to when main touched the same files.
  coverage:
    name: Coverage
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # four uploads, each may wait up to 160 s for processing
    permissions:
      contents: read
      code-quality: write

    steps:
      - name: Download test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-test-results
          path: TestResults

      # The solution-level test run puts each project's coverage in a GUID folder; the copy the .trx
      # attaches (`<runDeploymentRoot>/In/<href>`) is the one that can be traced back to the project.
      # Read both from the .trx: two projects starting in the same second share a folder name.
      - name: Resolve coverage file paths
        id: coverage-files
        shell: bash
        run: |
          for trx in TestResults/*.trx; do
            case "$(grep -m1 -oE 'storage="[^"]+\.dll"' "$trx" | head -1)" in
              *tacticusplanner.api.tests.dll*) label=api ;;
              *tacticusplanner.api.integrationtests.dll*) label=api-integration ;;
              *tacticusplanner.persistence.integrationtests.dll*) label=persistence ;;
              *tacticusplanner.gamecatalog.tests.dll*) label=game-catalog ;;
              *) continue ;;
            esac
            root=$(grep -m1 -oE 'runDeploymentRoot="[^"]+"' "$trx" | head -1 | cut -d'"' -f2)
            href=$(grep -m1 -oE '<A href="[^"]*coverage\.cobertura[^"]*\.xml"' "$trx" | head -1 | cut -d'"' -f2)
            file="TestResults/$root/In/$href"
            [ -n "$root" ] && [ -n "$href" ] && [ -f "$file" ] && echo "$label=$file" >> "$GITHUB_OUTPUT"
          done
          for label in api api-integration persistence game-catalog; do
            grep -q "^$label=" "$GITHUB_OUTPUT" || { echo "Missing coverage report for $label" >&2; exit 1; }
          done

      - name: Upload API coverage
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: ${{ steps.coverage-files.outputs.api }}
          language: C#
          label: coverage/api
          # Upload is rejected for some branch names (HTTP 400); a publishing hiccup must not fail the PR.
          fail-on-error: false

      - name: Upload API integration coverage
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: ${{ steps.coverage-files.outputs.api-integration }}
          language: C#
          label: coverage/api-integration
          fail-on-error: false

      - name: Upload persistence integration coverage
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: ${{ steps.coverage-files.outputs.persistence }}
          language: C#
          label: coverage/persistence
          fail-on-error: false

      - name: Upload GameCatalog coverage
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: ${{ steps.coverage-files.outputs.game-catalog }}
          language: C#
          label: coverage/game-catalog
          fail-on-error: false

  release-scripts:
    name: Release scripts (${{ matrix.os }})
    # Gated per step, not with a job-level `if`: a skipped matrix job reports one check named
    # "Release scripts (${{ matrix.os }})", so per-OS required checks would never report.
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out code
        if: needs.changes.outputs.release-scripts == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        if: needs.changes.outputs.release-scripts == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test release scripts
        if: needs.changes.outputs.release-scripts == 'true'
        run: node --test "scripts/release/*.test.mjs"
