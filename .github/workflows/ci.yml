name: CI

on:
  pull_request:
    branches:
      - main
      - "release/**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required checks must always report, so PRs are not filtered with paths-ignore;
  # instead the work is skipped (a skipped job satisfies a required check).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename') || { echo code=true >> "$GITHUB_OUTPUT"; exit 0; }
          if grep -qvE '\.md$|^(openspec|\.claude|\.agents)/|^LICENSE$' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: changes
    uses: ./.github/workflows/_build-api.yml
    with:
      skip: ${{ needs.changes.outputs.code != 'true' }}

  release-scripts:
    name: Release scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test release scripts
        run: node --test "scripts/release/*.test.mjs"
