name: CI

on:
  pull_request:
    branches:
      - main
      - "release/**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required checks must always report, so PRs are not filtered with paths-ignore;
  # instead the work is skipped (a skipped job satisfies a required check).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename') || { echo code=true >> "$GITHUB_OUTPUT"; exit 0; }
          if grep -qvE '\.md$|^(openspec|\.claude|\.agents)/|^LICENSE$' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: changes
    uses: ./.github/workflows/_build-api.yml
    with:
      skip: ${{ needs.changes.outputs.code != 'true' }}

  # Publishes the coverage that Build already collected, so PR tests run once. Publishing needs a
  # write token, so it runs apart from the job that executes the PR's code. Named "Coverage" to
  # satisfy the required check of that name.
  coverage:
    name: Coverage
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # four uploads, each may wait up to 160 s for processing
    permissions:
      contents: read
      code-quality: write

    steps:
      - name: Download test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-test-results
          path: TestResults

      # The solution-level test run puts each project's coverage in a GUID folder; the copy next to
      # each project's .trx (named after the .trx) is the one that can be traced back to the project.
      - name: Resolve coverage file paths
        id: coverage-files
        shell: bash
        run: |
          for trx in TestResults/*.trx; do
            case "$(grep -oE 'storage="[^"]+\.dll"' "$trx" | head -1)" in
              *tacticusplanner.api.tests.dll*) label=api ;;
              *tacticusplanner.api.integrationtests.dll*) label=api-integration ;;
              *tacticusplanner.persistence.integrationtests.dll*) label=persistence ;;
              *tacticusplanner.gamecatalog.tests.dll*) label=game-catalog ;;
              *) continue ;;
            esac
            file=$(find "${trx%_net*.trx}/In" -name coverage.cobertura.xml -print -quit)
            [ -n "$file" ] && echo "$label=$file" >> "$GITHUB_OUTPUT"
          done
          for label in api api-integration persistence game-catalog; do
            grep -q "^$label=" "$GITHUB_OUTPUT" || { echo "Missing coverage report for $label" >&2; exit 1; }
          done

      - name: Upload API coverage
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: ${{ steps.coverage-files.outputs.api }}
          language: C#
          label: coverage/api
          # Upload is rejected for some branch names (HTTP 400); a publishing hiccup must not fail the PR.
          fail-on-error: false

      - name: Upload API integration coverage
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: ${{ steps.coverage-files.outputs.api-integration }}
          language: C#
          label: coverage/api-integration
          fail-on-error: false

      - name: Upload persistence integration coverage
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: ${{ steps.coverage-files.outputs.persistence }}
          language: C#
          label: coverage/persistence
          fail-on-error: false

      - name: Upload GameCatalog coverage
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: ${{ steps.coverage-files.outputs.game-catalog }}
          language: C#
          label: coverage/game-catalog
          fail-on-error: false

  release-scripts:
    name: Release scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test release scripts
        run: node --test "scripts/release/*.test.mjs"
