name: Build API

on:
  workflow_call:
    inputs:
      skip:
        description: Skip the build (reports the check as skipped, which satisfies required checks).
        required: false
        type: boolean
        default: false
      ref:
        description: Git ref to check out. Defaults to the triggering ref.
        required: false
        type: string
        default: ""
      run-validation:
        description: Run formatting validation before building.
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build API
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ConnectionStrings__planner-db: Host=localhost;Port=5432;Database=tacticus_planner;Username=postgres;Password=postgres
      Authentication__Authority: https://example.ciamlogin.com/example.onmicrosoft.com/v2.0
      Authentication__Audience: api://tacticus-planner-api-ci

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked solution dependencies
        run: dotnet restore TacticusPlanner.slnx --locked-mode

      - name: Restore platform-specific AppHost dependencies
        run: dotnet restore orchestration/TacticusPlanner.AppHost/TacticusPlanner.AppHost.csproj

      - name: Check formatting
        if: ${{ inputs.run-validation }}
        run: dotnet format TacticusPlanner.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build TacticusPlanner.slnx --configuration Release --no-restore

      # The build regenerates the OpenAPI document; a stale committed copy fails here with the diff.
      - name: Check OpenAPI document is current
        run: git diff --exit-code -- artifacts/openapi

      - name: Test
        run: dotnet test TacticusPlanner.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults

      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-results
          path: TestResults/
          if-no-files-found: ignore

      - name: Build container image
        run: docker build --file src/TacticusPlanner.Api/Dockerfile --tag tacticus-planner-api:${{ github.sha }} .
