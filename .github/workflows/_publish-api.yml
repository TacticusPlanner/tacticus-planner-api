name: Publish image

# Builds an image (the API, or the jobs container) for a commit and pushes it to the shared
# registry, tagged with the commit SHA. A commit that already has an image (for example a release
# cut from main, which CD Stage built) is not rebuilt, so production runs the same digest staging ran.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build.
        required: true
        type: string
      repository:
        description: Registry repository (image name).
        required: false
        type: string
        default: tacticus-planner-api
      dockerfile:
        description: Dockerfile that builds the image.
        required: false
        type: string
        default: src/TacticusPlanner.Api/Dockerfile
    outputs:
      image:
        description: Immutable image reference (<acr>.azurecr.io/<repository>@sha256:...).
        value: ${{ jobs.publish.outputs.image }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The stage deployment identity holds AcrPush on the shared registry; publishing an image
    # changes no environment, so production releases use it too.
    environment: stage
    outputs:
      image: ${{ steps.image.outputs.reference }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve source revision
        id: source
        shell: bash
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Only a confirmed missing image means "build it". Any other lookup failure stops the
          # run, so an existing tag is never rebuilt over the digest staging already verified.
          errors="$RUNNER_TEMP/acr-lookup.err"
          if digest="$(az acr repository show \
            --name "$ACR_NAME" \
            --image "$REPOSITORY:$sha" \
            --query digest \
            --output tsv 2> "$errors")"; then
            :
          elif grep -qiE 'MANIFEST_UNKNOWN|NAME_UNKNOWN|not found|does not exist' "$errors"; then
            digest=""
          else
            cat "$errors" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure Container Registry
        if: steps.source.outputs.digest == ''
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Set up Docker Buildx
        if: steps.source.outputs.digest == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image
        id: build
        if: steps.source.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/${{ inputs.repository }}:${{ steps.source.outputs.sha }}
          # One cache per image, so the two images never evict each other's layers.
          cache-from: type=gha,scope=${{ inputs.repository }}
          cache-to: type=gha,mode=max,scope=${{ inputs.repository }}

      - name: Set immutable image reference
        id: image
        shell: bash
        env:
          DIGEST: ${{ steps.source.outputs.digest || steps.build.outputs.digest }}
        run: |
          reference="${{ vars.ACR_NAME }}.azurecr.io/${{ inputs.repository }}@$DIGEST"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$reference\`" >> "$GITHUB_STEP_SUMMARY"
