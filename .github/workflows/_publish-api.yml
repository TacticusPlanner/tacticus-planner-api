name: Publish API image

# Builds the API image for a commit and pushes it to the shared registry, tagged with the commit
# SHA. A commit that already has an image (for example a release cut from main, which CD Stage
# built) is not rebuilt, so production runs the same digest staging ran.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build.
        required: true
        type: string
    outputs:
      image:
        description: Immutable image reference (<acr>.azurecr.io/tacticus-planner-api@sha256:...).
        value: ${{ jobs.publish.outputs.image }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The stage deployment identity holds AcrPush on the shared registry; publishing an image
    # changes no environment, so production releases use it too.
    environment: stage
    outputs:
      image: ${{ steps.image.outputs.reference }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve source revision
        id: source
        shell: bash
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Only a confirmed missing image means "build it". Any other lookup failure stops the
          # run, so an existing tag is never rebuilt over the digest staging already verified.
          errors="$RUNNER_TEMP/acr-lookup.err"
          if digest="$(az acr repository show \
            --name "$ACR_NAME" \
            --image "tacticus-planner-api:$sha" \
            --query digest \
            --output tsv 2> "$errors")"; then
            :
          elif grep -qiE 'MANIFEST_UNKNOWN|NAME_UNKNOWN|not found' "$errors"; then
            digest=""
          else
            cat "$errors" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure Container Registry
        if: steps.source.outputs.digest == ''
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Set up Docker Buildx
        if: steps.source.outputs.digest == ''
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        if: steps.source.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TacticusPlanner.Api/Dockerfile
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/tacticus-planner-api:${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set immutable image reference
        id: image
        shell: bash
        env:
          DIGEST: ${{ steps.source.outputs.digest || steps.build.outputs.digest }}
        run: |
          reference="${{ vars.ACR_NAME }}.azurecr.io/tacticus-planner-api@$DIGEST"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$reference\`" >> "$GITHUB_STEP_SUMMARY"
