name: CD Prod

# Release (release.yml) calls this with the tag it just created. Run it by hand only to redeploy
# an existing release tag. A tag on a main commit reuses the image CD Stage built; a patch tag on
# a release branch gets its image built here.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to deploy, such as v1.4.0.
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: Release tag to deploy.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  # Production only ships released versions, never an arbitrary branch or commit.
  check-release:
    name: Check release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the ref is a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          # gh release view also finds drafts, so require isDraft to be false.
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || [[ "$(gh release view "$REF" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null)" != "false" ]]; then
            echo "::error::$REF is not a published release tag (vX.Y.Z)."
            exit 1
          fi

  publish:
    name: Publish
    needs: check-release
    uses: ./.github/workflows/_publish-api.yml
    with:
      ref: refs/tags/${{ inputs.ref }}

  deploy:
    name: Deploy Production
    needs: publish
    uses: ./.github/workflows/_deploy-api.yml
    with:
      environment: production
      image: ${{ needs.publish.outputs.image }}
